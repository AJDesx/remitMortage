name: Accessibility (axe)

# Scans every route with axe-core in both light and dark themes and fails on
# new serious/critical violations that are not in the reviewed allowlist
# (frontend/a11y/allowlist.json). A route added without being registered in
# frontend/a11y/routes.json fails the coverage check. The readable report is
# written to the job summary and uploaded as an artifact.
# See docs/AXE_ACCESSIBILITY_TESTING.md.

on:
  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/a11y-axe.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/a11y-axe.yml"

permissions:
  contents: read

concurrency:
  group: a11y-axe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-coverage:
    name: Route coverage + gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Every route registered, allowlist valid
        run: npx jest __tests__/a11y-route-coverage.test.ts __tests__/a11y-axe-lib.test.ts --no-coverage
        working-directory: frontend

  axe-scan:
    name: Axe scan (all routes, light + dark)
    needs: route-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build Next.js Application
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAWXDSZM52E5BW7G6TFX7DTXSHF7F75TUSSWW7B442NBEU3CADXNVTXH
          NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          NEXT_PUBLIC_USDC_TOKEN_ID: CCERWUE35WN7M4PN6XYK7CDCJZX35TC53TFATJNBRA6I3FDS3RVS65YF
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
          NEXT_PUBLIC_ADMIN_ADDRESS: GAXI4LZGQ7F3CKOBU7S6MFYKZRCNFRQVXJXKOMZ7GM7MIFST5W54AAAA

      - name: Start Next.js App in Background
        run: npm run start &
        working-directory: frontend
        env:
          PORT: 3000
          NEXT_PUBLIC_ADMIN_ADDRESS: GAXI4LZGQ7F3CKOBU7S6MFYKZRCNFRQVXJXKOMZ7GM7MIFST5W54AAAA

      - name: Wait for Next.js Server to be Ready
        run: npx wait-on http://localhost:3000 --timeout 60000
        working-directory: frontend

      - name: Run axe on every route
        run: npm run test:a11y:axe
        working-directory: frontend
        env:
          A11Y_SKIP_SERVER: "1"

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-accessibility-report
          path: |
            frontend/a11y-report/report.md
            frontend/a11y-report/results.json
            frontend/a11y-report/html
            frontend/a11y-report/results
          if-no-files-found: ignore
          retention-days: 14

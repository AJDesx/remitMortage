name: Backup Verification

# A backup is only as good as its last successful restore. Two drills run
# here:
#
#   verify-restore      On every PR touching the drill's own inputs, a cheap
#                        self-test: dump → restore → diff against a freshly
#                        seeded sandbox. Catches regressions in the drill
#                        mechanism itself without touching real backups or
#                        prod credentials.
#
#   real-restore-drill  Monthly (and on manual dispatch), the real drill:
#                        restores the actual latest backup object from
#                        production cloud storage and sanity-checks it (core
#                        tables non-empty, schema version matches what's
#                        currently deployed) — proving the backup that would
#                        really be used in an incident is actually usable,
#                        not just that the restore mechanism works in theory.
#
# Both alert by email on failure. See docs/BACKUP_RESTORE_DRILL.md.
on:
  schedule:
    # 04:00 UTC on the 1st of every month.
    - cron: '0 4 1 * *'
  workflow_dispatch:
  # Guard the drill itself against regressions when its own inputs change.
  pull_request:
    paths:
      - '.github/workflows/backup-verification.yml'
      - 'scripts/verify-backup-restore.sh'
      - 'scripts/verify-backup-key-rotation.sh'
      - 'backend/prisma/schema.prisma'
      - 'backend/scripts/restore-latest-backup.ts'
      - 'backend/src/services/databaseBackup.ts'

permissions:
  contents: read

permissions:
  contents: read

jobs:
  verify-restore:
    name: Restore Drill (Sandbox Postgres)
    # Self-test of the drill mechanism against freshly seeded data. The real
    # monthly/dispatch drill against production's actual latest backup is the
    # real-restore-drill job below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mock primary — stands in for production, seeded from the real schema.
      SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remitmortgage_source
      # Throwaway target the dump is restored into. Wiped by the drill.
      SANDBOX_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remitmortgage_sandbox
      REPORT_PATH: backup-verification-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The runner image ships an older client than the server above; a
      # pg_dump older than its server refuses to run, so pin them together.
      - name: Install PostgreSQL 16 Client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Create Source and Sandbox Databases
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE DATABASE remitmortgage_source;"
          psql -h localhost -U postgres -c "CREATE DATABASE remitmortgage_sandbox;"

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      # Applies the live Prisma schema so the drill exercises the real tables
      # and indices rather than a hand-written fixture that can drift.
      - name: Apply Prisma Schema to Source Database
        run: npx prisma db push --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}

      - name: Seed Source Database
        run: npm run db:seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        continue-on-error: true

      - name: Run Restore Drill
        id: drill
        run: ./scripts/verify-backup-restore.sh

      - name: Upload Validation Log
        # Keep the summary either way — a passing run is the audit record that
        # the drill mechanism itself still works.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-verification-report
          path: ${{ env.REPORT_PATH }}
          retention-days: 90

  real-restore-drill:
    name: Restore Drill (Latest Production Backup)
    # The real drill: restores production's actual latest backup object and
    # sanity-checks it. Runs monthly and on manual dispatch — never on a PR,
    # since it needs real cloud-storage credentials and the decryption key.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway target the real backup is restored into. Wiped by the drill.
      SANDBOX_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/remitmortgage_sandbox
      BACKUP_PROVIDER: aws
      BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORED_INFO_PATH: backup-drill-restored.json
      REPORT_PATH: backup-sanity-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The runner image ships an older client than the server above; a
      # pg_restore older than its server refuses to run, so pin them together.
      - name: Install PostgreSQL 16 Client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_restore --version

      - name: Create Sandbox Database
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE DATABASE remitmortgage_sandbox;"

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Restore Latest Production Backup
        id: restore
        run: npx tsx scripts/restore-latest-backup.ts --out "../${{ env.RESTORED_INFO_PATH }}"
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.SANDBOX_DATABASE_URL }}

      - name: Run Sanity Checks
        id: sanity
        run: ./scripts/verify-restored-backup-sanity.sh
        env:
          RESTORED_BACKUP_INFO: ${{ env.RESTORED_INFO_PATH }}

      - name: Upload Drill Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-real-drill-report
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.RESTORED_INFO_PATH }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Email Alert on Failed Recovery Check
        if: failure() && github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          from: RemitMortgage Backup Verification
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: "[FAILED] Production backup restore drill — ${{ github.repository }}"
          body: |
            The database backup restoration drill against the real latest
            production backup failed.

            Repository: ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}

            A failure here means either the latest production backup could
            not be downloaded/decrypted/restored at all, or it restored but
            failed a sanity check — an empty core table, or a schema version
            that doesn't match what's currently deployed. Treat recovery as
            unproven until this is resolved; see
            docs/BACKUP_RESTORE_DRILL.md for triage steps.

            The validation log is attached to the run as the
            "backup-verification-report" artifact.

  verify-key-rotation:
    name: Verify Backup Encryption Key Rotation
    # Checks real production backup metadata against AWS credentials; skip on
    # PR runs, which neither have those secrets nor need this signal — a
    # config-only change here is exercised by the schedule/dispatch runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET || 'remitmortgage-backups' }}
      BACKUP_KEY_ROTATION_INTERVAL_DAYS: ${{ vars.BACKUP_KEY_ROTATION_INTERVAL_DAYS || '90' }}
      EXPECTED_ENCRYPTION_KEY_ID: ${{ vars.BACKUP_ENCRYPTION_KEY_ID }}
      REPORT_PATH: backup-key-rotation-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run Key Rotation Check
        id: rotation
        run: |
          chmod +x scripts/verify-backup-key-rotation.sh
          scripts/verify-backup-key-rotation.sh

      - name: Upload Rotation Check Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-key-rotation-report
          path: ${{ env.REPORT_PATH }}
          retention-days: 90

      - name: Email Alert on Stuck Rotation
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          from: RemitMortgage Backup Verification
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: "[FAILED] Backup encryption key rotation check — ${{ github.repository }}"
          body: |
            The backup encryption key rotation check failed.

            Repository: ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.event_name }}

            The encryption key used for the most recent database backup either
            has not rotated within the configured policy window, or does not
            match the key currently on file — a stuck rotation could mean
            months of backups are encrypted under a single aging key.

            See the "backup-key-rotation-report" artifact for details, and
            docs/SECRETS_ROTATION.md ("Backup encryption key") for how to
            rotate BACKUP_ENCRYPTION_KEY.

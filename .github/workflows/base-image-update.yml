name: Base Image Update Bot

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-base-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check and update base image digests
        id: check_updates
        run: |
          UPDATED=0
          for df in $(find . -name Dockerfile); do
            # Extract image name and tag, ignoring AS alias
            BASE_IMAGE=$(grep -m 1 -E "^FROM " $df | awk '{print $2}' | cut -d'@' -f1)
            if [ -n "$BASE_IMAGE" ]; then
              docker pull "$BASE_IMAGE"
              NEW_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$BASE_IMAGE" | grep -o '@sha256:.*' || true)
              # fallback if RepoDigests doesn't contain @sha256 directly but format does
              if [ -z "$NEW_DIGEST" ]; then
                NEW_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$BASE_IMAGE" | awk -F'@' '{print "@"$2}')
              fi
              
              if [ -n "$NEW_DIGEST" ] && [ "$NEW_DIGEST" != "@" ]; then
                NEW_FROM="FROM ${BASE_IMAGE}${NEW_DIGEST}"
                OLD_FROM=$(grep -m 1 -E "^FROM " $df | awk '{print $1 " " $2}')
                # keep AS alias if present
                ALIAS=$(grep -m 1 -E "^FROM " $df | awk '{if ($3 == "AS" || $3 == "as") print " AS " $4}')
                
                if [ "$OLD_FROM" != "$NEW_FROM" ]; then
                  sed -i "s|^FROM .*|${NEW_FROM}${ALIAS}|" $df
                  UPDATED=1
                  echo "Updated $df with new digest $NEW_DIGEST"
                fi
              fi
            fi
          done
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT

      - name: Build and Scan Images
        if: steps.check_updates.outputs.updated == '1'
        run: |
          docker build -t remitmortgage-frontend:scan ./frontend
          docker build -t remitmortgage-backend:scan ./backend
          
      - name: Run Trivy vulnerability scanner on Frontend
        if: steps.check_updates.outputs.updated == '1'
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          image-ref: 'remitmortgage-frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Backend
        if: steps.check_updates.outputs.updated == '1'
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          image-ref: 'remitmortgage-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Create Pull Request
        if: steps.check_updates.outputs.updated == '1'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(devops): update base image digests'
          branch: 'bot/update-base-images'
          delete-branch: true
          title: 'Automated Base Image Update'
          body: |
            This PR updates the base image digests for the Dockerfiles.
            
            Images were successfully built and scanned for critical/high vulnerabilities using Trivy.
            
            Please review the changes.

name: CodeQL

# Static Application Security Testing for the TypeScript backend and frontend.
#
# Runs on every PR that touches JS/TS so injection, XSS and similar code-level
# vulnerability classes are caught before merge. Results are uploaded to the
# GitHub Security tab (Code scanning alerts) via the CodeQL action's built-in
# SARIF upload.
#
# The Rust contracts are not analysed here — CodeQL has no Rust support. They
# are covered by clippy and cargo-audit in security-checks.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  # A weekly full scan catches newly published queries finding issues in code
  # that has not changed recently.
  schedule:
    - cron: '17 3 * * 1'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      # Required by the action to read the repository.
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            path: backend
          - component: frontend
            path: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      # Dependencies are installed so CodeQL can resolve imports into
      # node_modules. Without this, taint tracking through third-party
      # middleware (express, next) is largely blind.
      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ matrix.path }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-precision, higher-recall security
          # queries on top of the default suite — the point of running SAST at
          # all. security-and-quality would also pull in maintainability
          # queries, which would bury the security findings.
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
          source-root: ${{ matrix.path }}

      # The JS/TS extractor does not need a build; autobuild is a no-op that
      # keeps the workflow honest if a component later adds a compile step.
      - name: Autobuild
        uses: github/codeql-action/autobuild@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          working-directory: ${{ matrix.path }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          # A distinct category per component keeps the two analyses from
          # overwriting each other's results in the Security tab.
          category: /language:javascript-typescript/component:${{ matrix.component }}

  # ── Merge gate ────────────────────────────────────────────────────────────
  # analyze uploads to the Security tab but does not by itself fail on
  # findings. This job re-reads the uploaded alerts through the code-scanning
  # API and fails when any *new* high or critical alert is open on the PR,
  # which is what makes the check blocking.
  high-severity-gate:
    name: Block on high-severity findings
    needs: analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: read
      contents: read
      pull-requests: read

    steps:
      - name: Fail on open high/critical code scanning alerts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const severities = new Set(['high', 'critical']);

            // Alerts for this PR's head ref. `ref` scopes the query to the
            // branch under review so pre-existing alerts on main do not
            // block unrelated PRs.
            const ref = `refs/pull/${context.issue.number}/head`;

            let alerts;
            try {
              alerts = await github.paginate(
                github.rest.codeScanning.listAlertsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                  state: 'open',
                  per_page: 100,
                }
              );
            } catch (error) {
              if (error.status === 404) {
                core.info('No code scanning results for this ref yet.');
                return;
              }
              throw error;
            }

            const blocking = alerts.filter((alert) =>
              severities.has(
                (alert.rule?.security_severity_level ?? '').toLowerCase()
              )
            );

            if (blocking.length === 0) {
              core.info(`No high or critical alerts open on ${ref}.`);
              return;
            }

            const summary = blocking
              .map(
                (alert) =>
                  `- **${alert.rule.security_severity_level.toUpperCase()}** ` +
                  `${alert.rule.id}: ${alert.rule.description}\n` +
                  `  ${alert.most_recent_instance?.location?.path}` +
                  `:${alert.most_recent_instance?.location?.start_line} ` +
                  `([alert #${alert.number}](${alert.html_url}))`
              )
              .join('\n');

            await core.summary
              .addHeading('CodeQL: high-severity findings block this PR')
              .addRaw(
                'Fix each finding, or dismiss it in the Security tab with a ' +
                  'reason if it is a false positive. Dismissed alerts stop ' +
                  'blocking on the next run.\n\n'
              )
              .addRaw(summary)
              .write();

            core.setFailed(
              `${blocking.length} high/critical CodeQL alert(s) open on this PR.`
            );

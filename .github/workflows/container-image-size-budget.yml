name: Container Image Size Budget

# Enforces a per-image size budget on the production Docker images so a
# dependency bump or an accidentally-copied build artifact doesn't silently
# bloat what gets shipped. Mirrors the baseline-artifact pattern used by
# cost-drift-detection.yml: every push to main that touches a Dockerfile
# records the built image sizes as an artifact; every PR builds the same
# images, compares against that recorded baseline, and posts the size delta
# plus budget status to the PR's CI summary.
#
# See docs/CONTAINER_IMAGE_SIZE_BUDGET.md for the policy, the budgets
# themselves (scripts/image-size-budgets.json), and how to raise a budget.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/check-image-size-budget.mjs"
      - "scripts/image-size-budgets.json"
      - ".github/workflows/container-image-size-budget.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/check-image-size-budget.mjs"
      - "scripts/check-image-size-budget.test.mjs"
      - "scripts/image-size-budgets.json"
      - ".github/workflows/container-image-size-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASELINE_ARTIFACT: image-size-baseline

jobs:
  unit-tests:
    name: Image Size Budget Script Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: node --test scripts/check-image-size-budget.test.mjs

  record-baseline:
    name: Record Image Size Baseline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t remitmortgage-backend:baseline ./backend

      - name: Build frontend image
        run: docker build -t remitmortgage-frontend:baseline ./frontend

      - name: Measure image sizes
        run: |
          BACKEND_BYTES=$(docker image inspect remitmortgage-backend:baseline --format='{{.Size}}')
          FRONTEND_BYTES=$(docker image inspect remitmortgage-frontend:baseline --format='{{.Size}}')
          jq -n --argjson backend "$BACKEND_BYTES" --argjson frontend "$FRONTEND_BYTES" \
            '{backend: $backend, frontend: $frontend}' > image-sizes-baseline.json
          cat image-sizes-baseline.json

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: image-sizes-baseline.json
          retention-days: 90

  check-budget:
    name: Check Image Size Budget
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend image
        run: docker build -t remitmortgage-backend:pr ./backend

      - name: Build frontend image
        run: docker build -t remitmortgage-frontend:pr ./frontend

      - name: Measure image sizes
        run: |
          BACKEND_BYTES=$(docker image inspect remitmortgage-backend:pr --format='{{.Size}}')
          FRONTEND_BYTES=$(docker image inspect remitmortgage-frontend:pr --format='{{.Size}}')
          jq -n --argjson backend "$BACKEND_BYTES" --argjson frontend "$FRONTEND_BYTES" \
            '{backend: $backend, frontend: $frontend}' > image-sizes-current.json
          cat image-sizes-current.json

      # Use the baseline recorded by the most recent push-to-main build. If
      # none is found (first run, or the artifact expired), the check still
      # runs — it just reports "n/a" for the delta column instead of failing.
      - name: Download latest main baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow container-image-size-budget.yml \
            --branch main --event push --status success \
            --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$BASELINE_ARTIFACT" -D baseline; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No recorded main-branch image-size baseline available yet; size delta will show as n/a."
          fi

      - name: Check image size budget
        id: budget
        run: |
          set +e
          node scripts/check-image-size-budget.mjs \
            image-sizes-current.json \
            baseline/image-sizes-baseline.json \
            image-size-report.md
          EXIT=$?
          set -e
          cat image-size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-size-report-${{ github.event.pull_request.number || github.run_id }}
          path: |
            image-size-report.md
            image-sizes-current.json
          if-no-files-found: ignore
          retention-days: 30

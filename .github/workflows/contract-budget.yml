name: Contract Budget Regression

# Measures CPU instructions and memory for every public contract entry point
# (representative and worst-case inputs), prints a per-function budget table,
# and fails when usage grows past the tolerance in
# contracts/budget-tests/budget-config.json or approaches the network limit.
# See docs/CONTRACT_BUDGET_REGRESSION.md.

on:
  pull_request:
    branches: [main, development]
    paths:
      - 'contracts/**'
      - '.github/workflows/contract-budget.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: contract-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: Resource budget regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            contracts -> target

      # --nocapture prints the per-function budget table into the job log.
      - name: Check contract budgets
        run: cargo test -p budget-tests -- --nocapture
        working-directory: contracts

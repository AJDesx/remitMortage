name: Dependabot Auto-Merge

# Auto-merges Dependabot PRs that only contain minor/patch semver bumps, once
# required CI checks pass. Major version bumps and anything on the
# sensitive-dependency allowlist always require manual review.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check sensitive-dependency allowlist
        id: sensitive
        run: |
          allowlist_file=".github/dependabot-sensitive-deps.txt"
          dependency="${{ steps.metadata.outputs.dependency-names }}"
          is_sensitive=false

          if [ -f "$allowlist_file" ]; then
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              case "$pkg" in \#*) continue ;; esac
              for dep in $(echo "$dependency" | tr ',' ' '); do
                if [ "$dep" = "$pkg" ]; then
                  is_sensitive=true
                fi
              done
            done < "$allowlist_file"
          fi

          echo "is_sensitive=$is_sensitive" >> "$GITHUB_OUTPUT"

      - name: Approve and enable auto-merge for minor/patch updates
        if: |
          steps.sensitive.outputs.is_sensitive == 'false' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

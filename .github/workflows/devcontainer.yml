name: Dev Container

# Builds the dev container image on every change to .devcontainer/ so it can
# never silently stop building, and re-checks weekly to catch base-image and
# toolchain rot. A failing build blocks the PR (issue #878).

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    branches: [main, development]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build dev container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate devcontainer.json
        run: node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json','utf8')); console.log('devcontainer.json is valid JSON')"

      - name: Validate docker-compose config
        run: docker compose -f .devcontainer/docker-compose.yml config -q

      - name: Build the dev container image
        run: docker build -f .devcontainer/Dockerfile -t remitmortgage-devcontainer:ci .

      - name: Smoke-test the toolchains
        run: |
          docker run --rm remitmortgage-devcontainer:ci bash -lc '
            set -e
            node --version
            npm --version
            rustc --version
            cargo --version
            rustup target list --installed | grep -E "wasm32-(unknown-unknown|v1-none)"
            echo "dev container toolchains OK"
          '

name: DNS Failover Drill

# Exercises the health-checked DNS failover in devops/terraform/dns-failover.
#
# The simulated job runs everywhere (including PRs) and is what proves the
# RTO/failback logic: it builds a deterministic failover→failback timeline and
# fails when recovery exceeds RTO_TARGET_SECONDS or failback never completes.
#
# The staging job runs only on a schedule / manual dispatch, against a
# disposable staging environment, using the same evaluator.
#
# Runbook: docs/DNS_FAILOVER_RUNBOOK.md

on:
  schedule:
    # Weekly, Tuesday 04:00 UTC.
    - cron: '0 4 * * 2'
  workflow_dispatch:
    inputs:
      rto_target_seconds:
        description: 'Failover RTO target in seconds (default 120)'
        required: false
        default: '120'
        type: string
  pull_request:
    paths:
      - '.github/workflows/dns-failover-drill.yml'
      - 'scripts/dns-failover-drill.mjs'
      - 'scripts/dns-failover-drill.test.mjs'
      - 'devops/terraform/dns-failover/**'
      - 'devops/prometheus/dns-failover-alerts.yml'
      - 'docs/DNS_FAILOVER_RUNBOOK.md'

permissions:
  contents: read

env:
  RTO_TARGET_SECONDS: ${{ inputs.rto_target_seconds || '120' }}
  FAILBACK_TARGET_SECONDS: '300'

jobs:
  simulate:
    name: Simulated Failover and Failback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Unit tests for the drill evaluator
        run: node --test scripts/dns-failover-drill.test.mjs

      - name: Run simulated failover drill
        run: |
          node scripts/dns-failover-drill.mjs \
            --simulate \
            --rto "$RTO_TARGET_SECONDS" \
            --failback "$FAILBACK_TARGET_SECONDS" \
            --json-out dns-failover-drill-result.json

      - name: Upload drill result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dns-failover-drill-result
          path: dns-failover-drill-result.json
          if-no-files-found: ignore
          retention-days: 90

  staging-drill:
    name: Staging Failover Drill (live)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run live staging failover drill
        env:
          DNS_FAILOVER_ENVIRONMENT: staging
          DNS_FAILOVER_HOST: ${{ secrets.DNS_FAILOVER_HOST }}
          DNS_FAILOVER_CONTROL_URL: ${{ secrets.DNS_FAILOVER_CONTROL_URL }}
          DNS_FAILOVER_PRIMARY_IP: ${{ secrets.DNS_FAILOVER_PRIMARY_IP }}
          DNS_FAILOVER_SECONDARY_IP: ${{ secrets.DNS_FAILOVER_SECONDARY_IP }}
        run: |
          if [ -z "$DNS_FAILOVER_HOST" ] || [ -z "$DNS_FAILOVER_CONTROL_URL" ]; then
            echo "DNS failover drill secrets are not configured — skipping live drill."
            exit 0
          fi
          node scripts/dns-failover-drill.mjs \
            --host "$DNS_FAILOVER_HOST" \
            --control-url "$DNS_FAILOVER_CONTROL_URL" \
            --primary-ip "$DNS_FAILOVER_PRIMARY_IP" \
            --secondary-ip "$DNS_FAILOVER_SECONDARY_IP" \
            --environment staging \
            --rto "$RTO_TARGET_SECONDS" \
            --failback "$FAILBACK_TARGET_SECONDS" \
            --json-out dns-failover-live-result.json

      - name: Upload live drill result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dns-failover-live-result
          path: dns-failover-live-result.json
          if-no-files-found: ignore
          retention-days: 90

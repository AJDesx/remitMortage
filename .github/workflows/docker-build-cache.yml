name: Docker Build Layer Caching

# Builds the backend and frontend images with BuildKit layer caching (GitHub
# Actions cache backend) so a rebuild with unchanged dependencies skips the
# `npm ci` layers. A second job measures cold vs. warm build time and publishes
# the numbers to the run summary.
#
# Secrets: the Dockerfiles must not bake credentials into any layer (cache
# export includes every stage). scripts/check-dockerfile-secrets.mjs enforces
# that, and a post-build step inspects the image history.
#
# See docs/DOCKER_BUILD_CACHING.md.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/check-dockerfile-secrets*"
      - "scripts/docker-cache-benchmark.sh"
      - ".github/workflows/docker-build-cache.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-lint:
    name: Dockerfile Secret Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node --test scripts/check-dockerfile-secrets.test.mjs
      - run: node scripts/check-dockerfile-secrets.mjs

  build:
    name: Build ${{ matrix.name }} (cached)
    needs: secret-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Build image with GitHub cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: remitmortgage-${{ matrix.name }}:ci
          # One cache scope per image. mode=max also exports intermediate
          # stages, which is why secrets must never be written to a layer.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Verify no secrets in image history
        run: |
          history="$(docker history --no-trunc --format '{{.CreatedBy}}' remitmortgage-${{ matrix.name }}:ci)"
          if grep -Eiq '(password|secret|token|api_?key|private_?key)=[^ ]+' <<<"$history"; then
            echo "::error::credential-like value found in image history"
            exit 1
          fi
          echo "image history contains no credential-like values"

  benchmark:
    name: Cache Benchmark
    needs: secret-lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Measure cold vs. warm rebuild
        run: |
          {
            echo "## Docker build time: cold vs. cached rebuild"
            echo
            echo "Warm = rebuild after a source-only change, dependencies unchanged."
            echo
            echo "| Image | Cold | Warm (cached) | Faster by |"
            echo "| --- | --- | --- | --- |"
            scripts/docker-cache-benchmark.sh backend backend src/index.ts | grep '^|'
            scripts/docker-cache-benchmark.sh frontend frontend next.config.ts | grep '^|'
          } | tee -a "$GITHUB_STEP_SUMMARY"

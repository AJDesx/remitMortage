name: E2E Borrower Onboarding

on:
  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e-onboarding.yml"

permissions:
  contents: read

concurrency:
  group: e2e-onboarding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-to-approval:
    name: Borrower onboarding to loan approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- e2e/onboarding-to-approval.spec.ts --project=chromium
        working-directory: frontend
        env:
          NEXT_PUBLIC_ADMIN_ADDRESS: GAXI4LZGQ7F3CKOBU7S6MFYKZRCNFRQVXJXKOMZ7GM7MIFST5W54AAAA
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
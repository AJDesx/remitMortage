name: Contract Event Schema Compatibility

# Fails when a contract change renames, removes or reorders an event field the
# indexer decodes, unless the schemaVersion bump is recorded in the golden
# fixture (contracts/event-schemas/). See docs/EVENT_SCHEMA_COMPATIBILITY.md.

on:
  pull_request:
    paths:
      - "contracts/**"
      - "backend/src/services/eventListener.ts"
      - "backend/src/services/eventIndexer.ts"
      - "backend/src/__tests__/eventSchemaCompatibility.test.ts"
      - ".github/workflows/event-schema.yml"

permissions:
  contents: read

jobs:
  event-schema:
    name: Event Schema Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Fixtures match contract sources
        run: node contracts/event-schemas/schema.cjs check
      - name: Indexer decodes every fixture event
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npx jest src/__tests__/eventSchemaCompatibility.test.ts --no-coverage --forceExit

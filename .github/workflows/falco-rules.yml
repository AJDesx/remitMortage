name: Falco Rules

# Validates the custom Falco rules/exceptions with Falco itself and checks that
# Falco alerts are routed to PagerDuty only when critical. See
# docs/FALCO_RUNTIME_DETECTION.md.

on:
  pull_request:
    paths:
      - "devops/falco/**"
      - "devops/prometheus/alertmanager.yml"
      - ".github/workflows/falco-rules.yml"
  push:
    branches: [main]
    paths:
      - "devops/falco/**"
      - "devops/prometheus/alertmanager.yml"
      - ".github/workflows/falco-rules.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate rules with Falco
        run: |
          docker run --rm -v "$PWD/devops/falco:/rules:ro" falcosecurity/falco-no-driver:0.39.2 \
            falco -V /etc/falco/falco_rules.yaml -V /rules/rules.yaml -V /rules/exceptions.yaml
      - name: Check alert routing with amtool
        run: |
          sed 's/\${[A-Z_]*}/https:\/\/example.invalid\/x/' devops/prometheus/alertmanager.yml > /tmp/am.yml
          run() { docker run --rm -v /tmp/am.yml:/am.yml:ro --entrypoint amtool prom/alertmanager:v0.27.0 \
            config routes test --config.file=/am.yml "$@"; }
          [ "$(run source=falco severity=critical)" = "pagerduty-critical,slack-ops" ]
          [ "$(run source=falco severity=warning)" = "slack-ops" ]

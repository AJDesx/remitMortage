name: Flaky Test Quarantine

# Two jobs:
#
#   * quarantine-gate — runs on every PR/push touching the flaky-test tooling.
#     It runs the unit tests, fails when a quarantine has EXPIRED (the
#     anti-forgetting rule), and verifies the generated dashboard is in sync.
#
#   * detect-and-quarantine — scheduled. Runs the backend suite, records the
#     outcomes, detects flaky tests, opens a tracking issue for each new one,
#     adds it to the quarantine registry, and opens a PR with the registry and
#     dashboard updates.
#
# Policy: docs/FLAKY_TEST_QUARANTINE.md

on:
  push:
    branches: [main]
    paths:
      - 'scripts/flaky-lib.mjs'
      - 'scripts/flaky-quarantine.mjs'
      - 'scripts/flaky-quarantine.test.mjs'
      - 'devops/testing/**'
      - 'docs/FLAKY_TEST_DASHBOARD.md'
      - 'docs/FLAKY_TEST_QUARANTINE.md'
      - 'backend/test/flakyQuarantine.cjs'
      - 'backend/package.json'
      - '.github/workflows/flaky-test-quarantine.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'scripts/flaky-lib.mjs'
      - 'scripts/flaky-quarantine.mjs'
      - 'scripts/flaky-quarantine.test.mjs'
      - 'devops/testing/**'
      - 'docs/FLAKY_TEST_DASHBOARD.md'
      - 'docs/FLAKY_TEST_QUARANTINE.md'
      - 'backend/test/flakyQuarantine.cjs'
      - 'backend/package.json'
      - '.github/workflows/flaky-test-quarantine.yml'
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quarantine-gate:
    name: Quarantine expiry and dashboard gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Unit tests for the flaky-test tooling
        run: node --test scripts/flaky-quarantine.test.mjs

      - name: Fail on expired quarantines
        run: node scripts/flaky-quarantine.mjs check

      - name: Verify the dashboard is up to date
        run: node scripts/flaky-quarantine.mjs dashboard --check

  detect-and-quarantine:
    name: Detect flaky tests and open tracking issues
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      # The suite has known failures unrelated to this workflow, so a non-zero
      # exit is expected; we only care about the per-test outcomes.
      - name: Run backend tests (JSON)
        continue-on-error: true
        run: npx jest --no-coverage --json --outputFile=jest-results.json
        working-directory: backend

      - name: Record run and detect flaky tests
        run: |
          node scripts/flaky-quarantine.mjs record \
            --results backend/jest-results.json \
            --run-id "${{ github.run_id }}"
          node scripts/flaky-quarantine.mjs detect --json-out flaky-detected.json

      - name: Quarantine new flaky tests with tracking issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const detected = fs.existsSync('flaky-detected.json')
              ? JSON.parse(fs.readFileSync('flaky-detected.json', 'utf8'))
              : { tests: [] };
            const fresh = detected.tests.filter((t) => !t.quarantined);

            if (fresh.length === 0) {
              core.notice('No new flaky tests detected.');
              return;
            }

            const { owner, repo } = context.repo;
            let quarantined = 0;

            for (const test of fresh) {
              const issue = await github.rest.issues.create({
                owner,
                repo,
                title: `[Flaky] ${test.name}`,
                body: [
                  'The scheduled flaky-test detection found this test.',
                  '',
                  `- Runs observed: ${test.runs}`,
                  `- Passed: ${test.passed}`,
                  `- Failed: ${test.failed}`,
                  `- Retried passes: ${test.retriedPasses}`,
                  `- Fail rate: ${(test.failRate * 100).toFixed(0)}%`,
                  `- File: \`${test.file ?? 'unknown'}\``,
                  '',
                  `It has been quarantined (skipped) with a 14-day expiry. Fix the test,`,
                  `then run \`node scripts/flaky-quarantine.mjs release --test ${JSON.stringify(test.name)}\``,
                  'and regenerate the dashboard.',
                  '',
                  'See docs/FLAKY_TEST_QUARANTINE.md.',
                ].join('\n'),
                labels: ['flaky-test', 'testing'],
              });

              execSync(
                `node scripts/flaky-quarantine.mjs quarantine --test ${JSON.stringify(test.name)} ` +
                  `--issue ${issue.data.number} --days 14 ` +
                  `--reason ${JSON.stringify('Auto-quarantined after flaky detection')}`,
                { stdio: 'inherit' }
              );
              quarantined += 1;
            }

            execSync('node scripts/flaky-quarantine.mjs dashboard', { stdio: 'inherit' });

            const branch = `chore/quarantine-flaky-tests-${context.runId}`;
            execSync(`git checkout -b ${branch}`, { stdio: 'inherit' });
            execSync(
              'git add devops/testing/quarantine.json devops/testing/flaky-history.json docs/FLAKY_TEST_DASHBOARD.md',
              { stdio: 'inherit' }
            );
            execSync(
              'git -c user.name="github-actions[bot]" ' +
                '-c user.email="41898282+github-actions[bot]@users.noreply.github.com" ' +
                `commit -m "chore(testing): quarantine ${quarantined} flaky test(s) (#877)"`,
              { stdio: 'inherit' }
            );
            execSync(`git push origin ${branch}`, { stdio: 'inherit' });

            await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: `chore(testing): quarantine ${quarantined} flaky test(s)`,
              body: 'Automated by the Flaky Test Quarantine workflow (#877).\n\nSee docs/FLAKY_TEST_QUARANTINE.md.',
            });

      - name: Upload detection artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-test-detection
          path: |
            flaky-detected.json
            devops/testing/flaky-history.json
            docs/FLAKY_TEST_DASHBOARD.md
          if-no-files-found: ignore
          retention-days: 30

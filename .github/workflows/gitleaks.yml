name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | bash
          sudo mv ./bin/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --exit-code 1 --log-opts="--all"

name: Infracost

# Surfaces the monthly cost impact of Terraform changes on every pull request.
# Posts a cost-diff comment (delta vs. the base branch) and flags — but never
# blocks — PRs whose monthly increase exceeds a configurable threshold.

on:
  pull_request:
    paths:
      - "devops/**.tf"
      - "infrastructure/terraform/**.tf"
      - "infracost.yml"
      - ".github/workflows/infracost.yml"

# Allow the workflow to read the code and write the cost-diff PR comment.
permissions:
  contents: read
  pull-requests: write

env:
  # Monthly USD increase above which a PR is flagged for reviewer attention.
  # Flagging is advisory only — it never fails the check.
  INFRACOST_THRESHOLD_USD: "50"

jobs:
  infracost:
    name: Terraform Cost Estimate
    runs-on: ubuntu-latest
    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Baseline: check out the PR's base branch and snapshot its cost.
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.event.pull_request.base.ref }}"

      - name: Generate Infracost baseline
        run: |
          infracost breakdown \
            --config-file=infracost.yml \
            --format=json \
            --out-file=/tmp/infracost-base.json

      # Candidate: check out the PR branch and diff against the baseline.
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate Infracost diff
        run: |
          infracost diff \
            --config-file=infracost.yml \
            --compare-to=/tmp/infracost-base.json \
            --format=json \
            --out-file=/tmp/infracost.json

      - name: Post cost-diff comment
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update

      # Advisory threshold: warn (do not fail) when the monthly delta is large.
      - name: Flag significant cost increases
        run: |
          DIFF=$(jq -r '.diffTotalMonthlyCost // "0"' /tmp/infracost.json)
          THRESHOLD="${INFRACOST_THRESHOLD_USD}"
          echo "Monthly cost delta: \$${DIFF} (threshold: \$${THRESHOLD})"
          # `jq`/awk numeric compare; both values are plain decimals.
          if awk "BEGIN { exit !(${DIFF} > ${THRESHOLD}) }"; then
            echo "::warning title=Significant infrastructure cost increase::This PR increases estimated monthly cost by \$${DIFF}, which exceeds the \$${THRESHOLD} review threshold. Please confirm this is intended."
          else
            echo "Cost delta within the \$${THRESHOLD} threshold."
          fi

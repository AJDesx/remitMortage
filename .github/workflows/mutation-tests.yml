name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run nightly

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Run cargo-mutants (Lending Pool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run Mutation Tests (lending-pool)
        run: cargo mutants -p lending-pool
        working-directory: contracts

      - name: Upload Mutation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: contracts/mutants.out
          retention-days: 14

  backend:
    name: Run Stryker (Scoring, Loans, Authentication)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Mutation Tests
        run: npm run test:mutation
        working-directory: backend

      - name: Upload Mutation Score and Surviving Mutants
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: backend/reports/mutation/
          retention-days: 30

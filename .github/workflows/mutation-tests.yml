name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run nightly

permissions:
  contents: read

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Run cargo-mutants (Lending Pool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            contracts -> target

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run Mutation Tests (lending-pool)
        run: cargo mutants -p lending-pool
        working-directory: contracts

      - name: Upload Mutation Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: contracts/mutants.out
          retention-days: 14

  backend:
    name: Run Stryker (Scoring, Loans, Authentication)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Mutation Tests
        run: npm run test:mutation
        working-directory: backend

      - name: Upload Mutation Score and Surviving Mutants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-mutation-report
          path: backend/reports/mutation/
          retention-days: 30

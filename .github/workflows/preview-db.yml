name: Ephemeral Preview Database

# Gives every pull request its own database instead of sharing staging:
#   1. restore an RDS instance from the latest anonymized staging snapshot
#   2. create an IAM-auth-only application role (no stored password)
#   3. run Prisma migrations on every push, seed fixtures on first creation
# The database is deleted when the PR closes (preview-env-teardown.yml) or when
# its TTL expires (the hourly sweep below).
#
# Only same-repository PRs get a database: fork PRs cannot read the AWS
# credentials, and running a fork's migrations against real infrastructure
# would be unsafe anyway.
#
# See docs/EPHEMERAL_PREVIEW_DATABASES.md.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "backend/**"
      - "scripts/preview-db.mjs"
      - ".github/workflows/preview-db.yml"
  schedule:
    # Hourly TTL sweep.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PREVIEW_DB_TTL_HOURS: "72"
  PREVIEW_DB_SNAPSHOT_ID: ${{ vars.PREVIEW_DB_SNAPSHOT_ID }}
  PREVIEW_DB_SOURCE_INSTANCE: ${{ vars.PREVIEW_DB_SOURCE_INSTANCE }}
  PREVIEW_DB_SUBNET_GROUP: ${{ vars.PREVIEW_DB_SUBNET_GROUP }}
  PREVIEW_DB_SECURITY_GROUP_IDS: ${{ vars.PREVIEW_DB_SECURITY_GROUP_IDS }}

jobs:
  unit-tests:
    name: Preview DB Script Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node --test scripts/preview-db.test.mjs

  provision:
    name: Provision Preview Database
    needs: unit-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-db-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision database from anonymized snapshot
        id: db
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          line="$(node scripts/preview-db.mjs provision --pr "${PR_NUMBER}")"
          echo "$line"
          echo "created=$(sed -n 's/.*created=\([a-z]*\).*/\1/p' <<<"$line")" >> "$GITHUB_OUTPUT"
          echo "endpoint=$(sed -n 's/.*endpoint=\([^ ]*\).*/\1/p' <<<"$line")" >> "$GITHUB_OUTPUT"

      - name: Create IAM-auth application role (first run only)
        if: steps.db.outputs.created == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          node scripts/preview-db.mjs bootstrap --pr "${PR_NUMBER}"

      - name: Mint a 15-minute database credential
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="$(node scripts/preview-db.mjs url --pr "${PR_NUMBER}")"
          echo "::add-mask::${url}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed data (first run only)
        if: steps.db.outputs.created == 'true'
        working-directory: backend
        run: npm run db:seed

      - name: Comment preview database details
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ENDPOINT: ${{ steps.db.outputs.endpoint }}
          TTL: ${{ env.PREVIEW_DB_TTL_HOURS }}
        with:
          script: |
            const marker = '<!-- preview-db -->';
            const body = [
              marker,
              '## Preview Database',
              '',
              `This PR has its own database: \`remit-preview-pr-${context.issue.number}\``,
              `- Endpoint: \`${process.env.ENDPOINT}\` (private network only)`,
              `- Data: anonymized staging snapshot; migrations from this PR applied`,
              `- Auth: RDS IAM tokens (15 min) — no stored password`,
              `- Deleted when this PR closes, or after ${process.env.TTL}h at the latest`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  ttl-sweep:
    name: Expire Preview Databases Past TTL
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Delete expired preview databases
        run: node scripts/preview-db.mjs sweep

name: Preview Environment Teardown

# Removes a PR preview environment within minutes of the PR being closed or
# merged, and posts a confirmation comment. Prevents the cloud spend and
# clutter the issue describes: a preview is only ever torn down by this
# workflow (close/merge trigger) or by the stale sweep
# (.github/workflows/stale-preview-sweep.yml) for environments the close
# trigger missed.
#
# Uses `pull_request_target` (not `pull_request`) so the workflow has access
# to the AWS credentials needed to remove resources even when the PR comes
# from a fork. This is safe here: the workflow only runs this repository's own
# trusted teardown script (checked out from the base branch) against tagged
# AWS resources — it never executes the PR's code, so an attacker-controlled
# PR cannot inject commands.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  teardown:
    name: Teardown Preview Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base branch, trusted code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Tear Down PR Preview Environment
        id: teardown
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x scripts/teardown-preview-env.sh
          scripts/teardown-preview-env.sh pr "${PR_NUMBER}" \
            | tee /tmp/preview-teardown.log

      - name: Post Teardown Confirmation Comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const pr = process.env.PR_NUMBER;
            const log = fs.readFileSync('/tmp/preview-teardown.log', 'utf8');
            const removals = log
              .split('\n')
              .filter((l) => l.startsWith('PREVIEW_TEARDOWN '));

            const header = [
              '## Preview Environment Teardown',
              '',
            ];

            let body;
            if (removals.length === 0) {
              body = [].concat(
                header,
                [
                  `No preview environment resources were found for PR #${pr} — nothing to remove.`,
                  'This is expected if no preview was provisioned for this PR, or it was already torn down by the stale sweep.',
                ],
              ).join('\n');
            } else {
              const lines = removals.map((l) => {
                const [, , type, id] = l.split(' ');
                return `- \`${type}\`: \`${id}\``;
              });
              body = [].concat(
                header,
                [
                  `The preview environment for PR #${pr} was torn down automatically after this PR was closed/merged.`,
                  '',
                  `Removed resources (${removals.length}):`,
                ],
                lines,
                ['', 'If you need the preview again, reopen the PR or re-provision it manually.'],
              ).join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(pr),
              body,
            });

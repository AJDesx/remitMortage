name: Prisma Schema Drift Detection

# Catches live production schema drift by running `prisma migrate diff` between
# the committed schema and a snapshot of the production database.
# A non-empty diff (exit code 2) is treated as drift and fails the job with a
# readable summary plus an SQL artifact. Clean schemas pass without false positives.
#
# Two modes:
#   - Snapshot-file mode (default): compares backend/prisma/__snapshots__/production-schema.prisma
#     against backend/prisma/schema.prisma. Works without secrets, deterministic in PRs from forks.
#   - Live-DB mode: when PRODUCTION_DATABASE_URL secret is set, compares the live DB
#     (via --from-config-datasource) against the committed schema. Used on main/schedule.

on:
  pull_request:
    paths:
      - 'backend/prisma/**'
      - 'backend/prisma.config.ts'
      - 'backend/scripts/detect-prisma-drift.sh'
      - 'backend/scripts/sync-production-schema.sh'
      - 'backend/src/utils/prismaDrift.ts'
      - '.github/workflows/prisma-drift.yml'
  push:
    branches: [main]
    paths:
      - 'backend/prisma/**'
      - 'backend/prisma.config.ts'
  schedule:
    # 03:00 UTC nightly — after terraform drift (02:00) and backup drill (04:00 on 1st)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  drift-check:
    name: Prisma Drift — schema vs production snapshot
    runs-on: ubuntu-latest
    # No postgres service needed for file-to-file mode; live-DB mode connects over network.
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Validate Prisma Schemas
        working-directory: backend
        run: |
          npx prisma validate --schema=prisma/schema.prisma
          if [ -f prisma/__snapshots__/production-schema.prisma ]; then
            npx prisma validate --schema=prisma/__snapshots__/production-schema.prisma
          else
            echo "⚠️  Snapshot file missing at prisma/__snapshots__/production-schema.prisma"
            echo "   File-to-file drift check will be skipped; live-DB mode may still run if secret is present."
          fi

      - name: Run Drift Detection (snapshot file mode)
        id: drift-file
        if: hashFiles('backend/prisma/__snapshots__/production-schema.prisma') != ''
        working-directory: backend
        run: |
          chmod +x ./scripts/detect-prisma-drift.sh
          # Always use --exit-code so drift is exit 2
          set +e
          ./scripts/detect-prisma-drift.sh --exit-code 2>&1 | tee drift-raw.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Persist readable summary (script already writes drift-summary.txt)
          if [ -f drift-summary.txt ]; then
            cat drift-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -f drift.sql ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### SQL to reconcile" >> "$GITHUB_STEP_SUMMARY"
            echo '```sql' >> "$GITHUB_STEP_SUMMARY"
            head -n 100 drift.sql >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "✅ No drift (snapshot file matches schema)"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Drift detected (snapshot vs schema)"
            # Keep exit 0 here so artifact upload still runs; final gate fails explicitly
          else
            echo "drift_detected=error" >> "$GITHUB_OUTPUT"
            echo "❌ Drift script error"
            exit 1
          fi

      - name: Run Drift Detection (live DB mode)
        id: drift-live
        if: secrets.PRODUCTION_DATABASE_URL != ''
        working-directory: backend
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # Fallback for scripts that read DATABASE_URL directly
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          chmod +x ./scripts/detect-prisma-drift.sh
          echo "▶ Live-DB mode: comparing production DB vs committed schema"
          set +e
          ./scripts/detect-prisma-drift.sh --from-config-datasource --exit-code 2>&1 | tee drift-live-raw.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -f drift-summary.txt ]; then
            cp drift-summary.txt drift-live-summary.txt
            cat drift-live-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          if [ -f drift.sql ]; then
            cp drift.sql drift-live.sql
          fi
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "live_drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "✅ No drift (live DB matches schema)"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "live_drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Drift detected (live DB vs schema)"
          else
            echo "live_drift_detected=error" >> "$GITHUB_OUTPUT"
            echo "❌ Live drift script error"
            exit 1
          fi

      - name: Upload Drift Artifacts (file mode)
        if: always() && hashFiles('backend/drift-summary.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prisma-drift-file-mode
          path: |
            backend/drift-summary.txt
            backend/drift.sql
            backend/drift-raw.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Drift Artifacts (live mode)
        if: always() && hashFiles('backend/drift-live-summary.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prisma-drift-live-mode
          path: |
            backend/drift-live-summary.txt
            backend/drift-live.sql
            backend/drift-live-raw.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on Drift (file mode)
        if: steps.drift-file.outputs.drift_detected == 'true'
        run: |
          echo "::error::Prisma schema drift detected (snapshot file vs committed schema). See drift-summary.txt artifact and docs/PRISMA_SCHEMA_DRIFT_REMEDIATION.md"
          echo ""
          echo "Human-readable diff (first 200 lines):"
          sed -n '1,200p' backend/drift-summary.txt || cat backend/drift-summary.txt
          exit 1

      - name: Fail on Drift (live mode)
        if: steps.drift-live.outputs.live_drift_detected == 'true'
        run: |
          echo "::error::Prisma schema drift detected (live production DB vs committed schema). See drift-live-summary.txt artifact and docs/PRISMA_SCHEMA_DRIFT_REMEDIATION.md"
          echo ""
          echo "Human-readable diff (first 200 lines):"
          sed -n '1,200p' backend/drift-live-summary.txt || cat backend/drift-live-summary.txt
          exit 1

      - name: Post Drift Notification (Slack/Discord) — file mode
        if: failure() && steps.drift-file.outputs.drift_detected == 'true' && secrets.DEVOPS_ALERT_WEBHOOK_URL != ''
        run: |
          SUMMARY=$(head -n 40 backend/drift-summary.txt | tail -n 30)
          PAYLOAD=$(jq -n \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg summary "$SUMMARY" \
            '{
              text: ("⚠️ *Prisma Schema Drift Detected* — snapshot file vs committed schema\n" +
                     "Repository: " + $run_url + "\n\n```" + $summary + "```\n" +
                     "See docs/PRISMA_SCHEMA_DRIFT_REMEDIATION.md for reconciliation.")
            }')
          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}" || echo "Webhook POST failed (non-blocking)"

      - name: Post Drift Notification (Slack/Discord) — live mode
        if: failure() && steps.drift-live.outputs.live_drift_detected == 'true' && secrets.DEVOPS_ALERT_WEBHOOK_URL != ''
        run: |
          SUMMARY=$(head -n 40 backend/drift-live-summary.txt | tail -n 30)
          PAYLOAD=$(jq -n \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg summary "$SUMMARY" \
            '{
              text: ("🚨 *Prisma Schema Drift Detected* — live production DB vs committed schema\n" +
                     "Production database has drifted from prisma/schema.prisma!\n" +
                     "Run: " + $run_url + "\n\n```" + $summary + "```")
            }')
          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}" || echo "Webhook POST failed (non-blocking)"

  # ── Summary job for branch protection (required check) ──────────────────
  drift-summary:
    name: Prisma Drift Summary
    runs-on: ubuntu-latest
    needs: [drift-check]
    if: always()
    steps:
      - name: Report Status
        run: |
          RESULT="${{ needs.drift-check.result }}"
          echo "drift-check result: $RESULT"
          if [ "$RESULT" = "failure" ]; then
            echo "❌ Drift detected or check failed — see prisma-drift job logs and artifacts"
            exit 1
          elif [ "$RESULT" = "skipped" ]; then
            echo "⚠️  Drift check skipped (no snapshot and no live DB secret)"
            exit 0
          else
            echo "✅ No drift — schema matches production snapshot"
          fi

name: Multi-Region Read Replica Promotion

# Codifies the manual read-replica promotion runbook (connection string
# cutover, replica promotion, application config update) as a single
# pipeline, instead of an operator running the AWS CLI commands by hand
# under incident pressure. See docs/MULTI_REGION_READ_REPLICA_PROMOTION.md.
#
# Safety is layered:
#   1. `dry_run` defaults to true — it validates preconditions (replica
#      health, replication lag, RDS instance status) and makes no changes.
#   2. A real promotion additionally requires this run to be manually
#      dispatched with dry_run explicitly set to false.
#   3. Targeting `environment: production` means this run is gated by
#      whatever required-reviewer protection that GitHub Environment has
#      configured — a second, independent approval, on top of the operator
#      who triggered the run in the first place.
#   4. scripts/promote-read-replica.sh itself refuses to execute without an
#      explicit --yes flag, which this workflow only passes when dry_run is
#      false — so even a misconfigured dispatch can't accidentally promote.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Validate preconditions only — make no changes'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  promote:
    name: Promote Read Replica
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      REPLICA_DB_INSTANCE_ID: ${{ secrets.REPLICA_DB_INSTANCE_ID }}
      REPLICA_DATABASE_URL: ${{ secrets.REPLICA_DATABASE_URL }}
      DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
      PROMOTED_DATABASE_URL_TEMPLATE: ${{ secrets.PROMOTED_DATABASE_URL_TEMPLATE }}
      APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
      REPORT_PATH: replica-promotion-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install PostgreSQL Client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dry Run — Validate Preconditions Only
        if: github.event.inputs.dry_run == 'true'
        run: ./scripts/promote-read-replica.sh --dry-run

      - name: Promote Read Replica
        if: github.event.inputs.dry_run != 'true'
        run: ./scripts/promote-read-replica.sh --yes

      - name: Upload Promotion Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replica-promotion-report-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore
          retention-days: 90

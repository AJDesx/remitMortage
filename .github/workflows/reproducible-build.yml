name: Reproducible Build

# Proves that the same commit produces byte-identical contract WASM. The
# contracts are built twice on two separate, freshly provisioned runners using
# scripts/reproducible-build.sh; the job fails if any hash differs. On a
# version tag, the verified hashes are published with the GitHub Release
# alongside the commit SHA. See docs/REPRODUCIBLE_BUILDS.md.

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/reproducible-build.sh"
      - "scripts/wasm-hashes.mjs"
      - "scripts/wasm-hashes.test.mjs"
      - "scripts/verify-deployed-contract.sh"
      - ".github/workflows/reproducible-build.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "contracts/**"
      - "scripts/reproducible-build.sh"
      - "scripts/wasm-hashes.mjs"
      - ".github/workflows/reproducible-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-tests:
    name: Manifest tooling tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run manifest unit tests
        run: node --test scripts/wasm-hashes.test.mjs

  build:
    name: Clean build ${{ matrix.run }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reproducible build
        run: scripts/reproducible-build.sh --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/out"

      - name: Upload build ${{ matrix.run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-build-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/out/*.wasm
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/out/wasm-hashes.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare hashes (must be identical)
    needs: [tooling-tests, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repro-build-a
          path: build-a
      - name: Download build B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repro-build-b
          path: build-b

      - name: Compare manifests
        run: |
          set -o pipefail
          node scripts/wasm-hashes.mjs compare build-a/wasm-hashes.json build-b/wasm-hashes.json | tee compare.txt
          {
            echo "## Reproducible build"
            echo '```'
            cat compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Byte-compare the WASM files
        run: |
          for f in build-a/*.wasm; do
            cmp "$f" "build-b/$(basename "$f")"
          done

  publish-hashes:
    name: Publish hashes with the release
    needs: compare
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repro-build-a
          path: release-assets

      - name: Attach hashes to the GitHub Release
        run: |
          set -euo pipefail
          cp release-assets/wasm-hashes.json "wasm-hashes-${TAG}.json"
          cp release-assets/SHA256SUMS "SHA256SUMS-${TAG}.txt"
          # release.yml creates the release from the same tag; wait for it.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            echo "Waiting for release $TAG ($attempt/30)..."; sleep 20
          done
          gh release upload "$TAG" "wasm-hashes-${TAG}.json" "SHA256SUMS-${TAG}.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

name: Generate SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM for Frontend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./frontend
          format: spdx-json
          output-file: frontend-sbom.spdx.json

      - name: Generate SBOM for Backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./backend
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Generate SBOM for Contracts
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./contracts
          format: spdx-json
          output-file: contracts-sbom.spdx.json

      - name: Upload Frontend SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom
          path: frontend-sbom.spdx.json

      - name: Upload Backend SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom
          path: backend-sbom.spdx.json

      - name: Upload Contracts SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-sbom
          path: contracts-sbom.spdx.json

      - name: Attach SBOMs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            frontend-sbom.spdx.json
            backend-sbom.spdx.json
            contracts-sbom.spdx.json

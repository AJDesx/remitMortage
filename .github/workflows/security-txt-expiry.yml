name: security.txt Expiry Monitoring

# researchers who find a problem need a documented, safe way to report it.
# /.well-known/security.txt (RFC 9116) is that channel, and an expired
# `Expires` field signals to researchers' tooling that it's unmaintained.
# This job checks the live file once a day and alerts ops by email while
# it's still inside the renewal window.
#
# Renewal procedure: devops/SECURITY_TXT_RENEWAL.md
on:
  schedule:
    # 07:00 UTC daily — a day's resolution is plenty against a 30-day window.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Override the renewal warning window (days)'
        required: false
        default: ''
  # Guard the check against regressions when its own inputs change.
  pull_request:
    paths:
      - '.github/workflows/security-txt-expiry.yml'
      - 'scripts/check-security-txt-expiry.sh'
      - 'frontend/public/.well-known/security.txt'

permissions:
  contents: read

concurrency:
  group: security-txt-expiry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-security-txt-expiry:
    name: Check security.txt Expiry
    runs-on: ubuntu-latest

    env:
      SECURITY_TXT_URL: ${{ vars.SECURITY_TXT_URL }}
      SECURITYTXT_WARN_DAYS: ${{ github.event.inputs.warn_days || vars.SECURITYTXT_WARN_DAYS || '30' }}
      SECURITYTXT_REPORT_PATH: security-txt-expiry-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A PR cannot reach the live production endpoint (and shouldn't need
      # to, to prove this change is sound) — validate the checked-in file
      # parses and isn't already expired instead.
      - name: Validate Local security.txt (pull request)
        if: github.event_name == 'pull_request'
        run: ./scripts/check-security-txt-expiry.sh --check-config

      - name: Run security.txt Expiry Check
        id: check
        if: github.event_name != 'pull_request'
        run: ./scripts/check-security-txt-expiry.sh

      - name: Upload Expiry Report
        # Keep the report either way — a passing run is the audit record
        # that the policy was verified live today.
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-txt-expiry-report
          path: ${{ env.SECURITYTXT_REPORT_PATH }}
          retention-days: 90

      # Alerts are scoped to scheduled/manual runs; a failing PR run already
      # surfaces on the PR itself and needs no page.
      - name: Email Alert on security.txt Approaching Expiry
        if: failure() && steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          from: RemitMortgage security.txt Monitor
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: "[ACTION] security.txt approaching expiry — ${{ github.repository }}"
          body: |
            The live /.well-known/security.txt is inside the
            ${{ env.SECURITYTXT_WARN_DAYS }}-day renewal warning window, is
            already expired, or could not be retrieved/parsed.

            Repository:   ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.event_name }}

            The attached "security-txt-expiry-report" artifact has the
            details (days remaining, state, parsed Expires value).

            Renewal runbook: devops/SECURITY_TXT_RENEWAL.md

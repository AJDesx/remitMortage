name: SLO Alert Validation

# Replays synthetic failure data through the SLO burn-rate alert tiers and
# verifies the generated Prometheus rules and Grafana dashboard are in sync with
# devops/slo/slos.json. See docs/SLO_ERROR_BUDGET_POLICY.md.

on:
  push:
    branches: [main]
    paths:
      - 'devops/slo/**'
      - 'devops/prometheus/slo-burn-rate-alerts.yml'
      - 'devops/prometheus/alertmanager.yml'
      - 'devops/grafana/**'
      - 'scripts/slo-lib.mjs'
      - 'scripts/generate-slo-artifacts.mjs'
      - 'scripts/slo-burn-rate.test.mjs'
      - '.github/workflows/slo-alert-validation.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'devops/slo/**'
      - 'devops/prometheus/slo-burn-rate-alerts.yml'
      - 'devops/prometheus/alertmanager.yml'
      - 'devops/grafana/**'
      - 'scripts/slo-lib.mjs'
      - 'scripts/generate-slo-artifacts.mjs'
      - 'scripts/slo-burn-rate.test.mjs'
      - '.github/workflows/slo-alert-validation.yml'

permissions:
  contents: read

jobs:
  slo-alert-validation:
    name: SLO burn-rate dry-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check generated SLO artifacts are up to date
        run: node scripts/generate-slo-artifacts.mjs --check

      - name: Replay synthetic failures through burn-rate alerts
        run: node --test scripts/slo-burn-rate.test.mjs

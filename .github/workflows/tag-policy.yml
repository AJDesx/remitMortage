name: Cloud Cost Allocation Tag Policy

# Enforces the standard cost-allocation tag set (Service, Environment, Owner,
# CostCenter) on AWS resources:
#   - policy-tests:   unit-tests the OPA policy and the default_tags check
#   - plan-check:     fails a PR whose Terraform plan creates/updates resources
#                     missing a required tag
#   - untagged-report: weekly report of existing untagged resources
#
# See docs/COST_ALLOCATION_TAG_POLICY.md.

on:
  pull_request:
    paths:
      - "devops/**"
      - "infrastructure/**"
      - "scripts/check-terraform-default-tags*"
      - "scripts/report-untagged-resources*"
      - ".github/workflows/tag-policy.yml"
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFTEST_VERSION: "0.45.0"
  OPA_VERSION: "0.70.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  policy-tests:
    name: Tag Policy Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install conftest and opa
        run: |
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          wget -q -O opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa && sudo mv opa /usr/local/bin/
      - name: Rego unit tests and plan fixtures (compliant / non-compliant)
        run: devops/policy/tags/run-tests.sh
      - name: Every AWS provider sets default_tags
        run: node scripts/check-terraform-default-tags.mjs
      - name: Script unit tests
        run: node --test scripts/check-terraform-default-tags.test.mjs scripts/report-untagged-resources.test.mjs

  plan-check:
    name: Plan Tag Check — ${{ matrix.module }}
    # Needs AWS credentials for data sources, which fork PRs cannot access.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [devops, infrastructure/terraform/elk, infrastructure/terraform/apm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false
      - name: Install conftest
        run: |
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Plan against an empty state (every resource is evaluated as a create)
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform plan -lock=false -out=tfplan -var="db_password=ci-placeholder"
          terraform show -json tfplan > plan.json
      - name: Enforce required tags
        run: conftest test --policy devops/policy/tags --namespace terraform.tags "${{ matrix.module }}/plan.json"

  untagged-report:
    name: Untagged Resource Report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Build report
        run: |
          node scripts/report-untagged-resources.mjs --format markdown --output untagged-resources.md
          node scripts/report-untagged-resources.mjs --format json --output untagged-resources.json
          cat untagged-resources.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: untagged-resources
          path: |
            untagged-resources.md
            untagged-resources.json
          retention-days: 90

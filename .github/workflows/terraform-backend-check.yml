name: Terraform Remote Backend & State Locking Verification

on:
  pull_request:
    paths:
      - '**/*.tf'
      - 'scripts/check-terraform-backend-locking.sh'
      - '.github/workflows/terraform-backend-check.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-terraform-backend:
    name: Verify Terraform State Locking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make Script Executable
        run: chmod +x ./scripts/check-terraform-backend-locking.sh

      - name: Run Backend & State Locking Audit
        run: ./scripts/check-terraform-backend-locking.sh

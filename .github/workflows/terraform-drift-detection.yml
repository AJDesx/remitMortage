name: Terraform Drift Detection

# Catches unauthorized or out-of-band infrastructure changes by running
# `terraform plan` nightly against each environment's live state.
# Any diff (exit code 2 from `terraform plan -detailed-exitcode`) is treated
# as drift and triggers a Slack/Discord notification plus a GitHub issue.

on:
  schedule:
    # 02:00 UTC every night — after backup jobs (02:00) settle
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Limit check to a single environment (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - dev
          - staging
          - production

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  # Prevents interactive prompts in any terraform sub-command
  TF_INPUT: "false"

jobs:
  # ── Drift check: devops/ root (dev / staging / production) ──────────────
  drift-main:
    name: Drift Check — ${{ matrix.environment }} (devops/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Run all three unless the caller pinned a specific environment
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.environment == '' ||
      github.event.inputs.environment == matrix.environment
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]

    env:
      TF_WORKSPACE_DIR: devops

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKSPACE_DIR }}
        run: terraform init -backend-config="key=remitmortgage/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform Plan (drift detection)
        id: plan
        working-directory: ${{ env.TF_WORKSPACE_DIR }}
        # -detailed-exitcode:
        #   0 = no changes (no drift)
        #   1 = error
        #   2 = changes detected (drift!)
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -no-color \
            -var="environment=${{ matrix.environment }}" \
            -var="db_password=${{ secrets.TF_DB_PASSWORD }}" \
            -out=tfplan-${{ matrix.environment }}.bin \
            2>&1 | tee plan-${{ matrix.environment }}.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "plan_exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          
          if [ "$PLAN_EXIT" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "✅ No drift detected for ${{ matrix.environment }}"
          elif [ "$PLAN_EXIT" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Drift detected for ${{ matrix.environment }}"
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "❌ Plan failed for ${{ matrix.environment }}"
            exit 1
          fi

      - name: Upload Plan Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-main-${{ matrix.environment }}
          path: ${{ env.TF_WORKSPACE_DIR }}/plan-${{ matrix.environment }}.txt
          retention-days: 30

      - name: Post Drift Notification (Slack/Discord)
        if: steps.plan.outputs.drift_detected == 'true'
        run: |
          PLAN_SUMMARY=$(tail -20 ${{ env.TF_WORKSPACE_DIR }}/plan-${{ matrix.environment }}.txt)
          PAYLOAD=$(jq -n \
            --arg env "${{ matrix.environment }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg summary "$PLAN_SUMMARY" \
            '{
              text: ("⚠️ *Terraform Drift Detected* — environment: `" + $env + "` (devops/)\n" +
                     "Unauthorized or out-of-band changes were found in production infrastructure.\n" +
                     "Run: " + $run_url + "\n\n```" + $summary + "```\n" +
                     "See `docs/terraform-drift-remediation.md` for remediation steps.")
            }')
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}"

      - name: Open GitHub Issue on Drift
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ matrix.environment }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] Terraform infrastructure drift detected — ${env} (devops/)`,
              body: [
                `## Terraform Drift Detected`,
                ``,
                `**Environment:** \`${env}\``,
                `**Terraform root:** \`devops/\``,
                `**Detected at:** ${new Date().toISOString()}`,
                `**Workflow run:** ${runUrl}`,
                ``,
                `The nightly \`terraform plan\` found differences between the Terraform state`,
                `and the live infrastructure in \`${env}\`. This usually means a resource was`,
                `modified, created, or deleted outside of Terraform (out-of-band change).`,
                ``,
                `### Next Steps`,
                `See [\`docs/terraform-drift-remediation.md\`](../blob/main/docs/terraform-drift-remediation.md)`,
                `for the full remediation runbook.`,
                ``,
                `### Quick Actions`,
                `- Download the plan artifact from the workflow run linked above.`,
                `- If the change is intentional, import or update Terraform state to match.`,
                `- If the change is unauthorized, revert it with \`terraform apply\`.`,
              ].join('\n'),
              labels: ['infrastructure', 'drift', 'needs-review'],
            });

  # ── Drift check: devops/terraform/ root (multi-region) ──────────────────
  drift-multiregion:
    name: Drift Check — multi-region (devops/terraform/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.environment == '' ||
      github.event.inputs.environment == 'production'

    env:
      TF_WORKSPACE_DIR: devops/terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKSPACE_DIR }}
        run: terraform init -backend-config="key=remitmortgage/multi-region/terraform.tfstate"

      - name: Terraform Plan (drift detection)
        id: plan
        working-directory: ${{ env.TF_WORKSPACE_DIR }}
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -no-color \
            -var="alert_email=${{ secrets.ALERT_EMAIL_TO }}" \
            2>&1 | tee plan-multiregion.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "plan_exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          
          if [ "$PLAN_EXIT" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "✅ No drift detected for multi-region"
          elif [ "$PLAN_EXIT" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Drift detected for multi-region"
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "❌ Plan failed for multi-region"
            exit 1
          fi

      - name: Upload Plan Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-multiregion
          path: ${{ env.TF_WORKSPACE_DIR }}/plan-multiregion.txt
          retention-days: 30

      - name: Post Drift Notification (Slack/Discord)
        if: steps.plan.outputs.drift_detected == 'true'
        run: |
          PLAN_SUMMARY=$(tail -20 ${{ env.TF_WORKSPACE_DIR }}/plan-multiregion.txt)
          PAYLOAD=$(jq -n \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg summary "$PLAN_SUMMARY" \
            '{
              text: ("⚠️ *Terraform Drift Detected* — multi-region failover (devops/terraform/)\n" +
                     "Run: " + $run_url + "\n\n```" + $summary + "```")
            }')
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}"

      - name: Open GitHub Issue on Drift
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] Terraform infrastructure drift detected — multi-region (devops/terraform/)`,
              body: [
                `## Terraform Drift Detected`,
                ``,
                `**Environment:** multi-region failover`,
                `**Terraform root:** \`devops/terraform/\``,
                `**Detected at:** ${new Date().toISOString()}`,
                `**Workflow run:** ${runUrl}`,
                ``,
                `The nightly \`terraform plan\` found differences in the multi-region failover stack.`,
                ``,
                `### Next Steps`,
                `See [\`docs/terraform-drift-remediation.md\`](../blob/main/docs/terraform-drift-remediation.md).`,
              ].join('\n'),
              labels: ['infrastructure', 'drift', 'needs-review'],
            });

  # ── Summary job: report overall drift status ────────────────────────────
  summary:
    name: Drift Detection Summary
    runs-on: ubuntu-latest
    needs: [drift-main, drift-multiregion]
    if: always()
    steps:
      - name: Report Status
        run: |
          MAIN="${{ needs.drift-main.result }}"
          MULTI="${{ needs.drift-multiregion.result }}"
          echo "drift-main result:        $MAIN"
          echo "drift-multiregion result: $MULTI"
          
          if [ "$MAIN" = "failure" ] || [ "$MULTI" = "failure" ]; then
            echo "❌ One or more drift checks encountered errors"
            exit 1
          else
            echo "✅ All drift checks completed (check individual jobs for drift status)"
          fi

name: Terraform Plan Comment

# Runs `terraform plan` for the Terraform modules touched by a pull request and
# posts ONE concise summary comment that is updated in place on every push.
# Destructive changes (destroy / replace) and security-sensitive resources
# (IAM, networking, secrets, KMS) are listed first; attribute values are never
# posted. See docs/TERRAFORM_PLAN_PR_COMMENT.md.
#
# Safety: this uses `pull_request` (not `pull_request_target`) and refuses to
# run for forks, so cloud credentials and plan contents are never exposed to
# untrusted code.

on:
  pull_request:
    paths:
      - "devops/**.tf"
      - "scripts/terraform-plan-summary.mjs"
      - "scripts/terraform-plan-summary.test.mjs"
      - ".github/workflows/terraform-plan-comment.yml"

concurrency:
  group: terraform-plan-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan-comment:
    name: Terraform Plan Summary
    runs-on: ubuntu-latest
    # Never plan (or post plan contents) for forks or other untrusted contexts.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run formatter unit tests
        run: node --test scripts/terraform-plan-summary.test.mjs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.9"
          # The wrapper would mix its own output into stdout; we need raw JSON.
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Plan affected modules
        id: plan
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/tfplan"
          OUT="$RUNNER_TEMP/tfplan"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.tf' '*.tfvars')
          ARGS=()
          FAILED=0

          # name | directory | state key | extra -var flags
          plan_module() {
            local name="$1" dir="$2" key="$3"; shift 3
            local slug="${name//\//-}"
            if ! echo "$CHANGED" | grep -q "^${dir}/[^/]*\.tf"; then
              return 0
            fi
            echo "::group::terraform plan — $name"
            if ( cd "$dir" \
                && terraform init -no-color -backend-config="key=$key" > "$OUT/$slug.log" 2>&1 \
                && terraform plan -no-color -lock=false -input=false "$@" -out="$OUT/$slug.bin" >> "$OUT/$slug.log" 2>&1 \
                && terraform show -json "$OUT/$slug.bin" > "$OUT/$slug.json" 2>> "$OUT/$slug.log" ); then
              ARGS+=(--module "$name=$OUT/$slug.json")
            else
              FAILED=1
              ARGS+=(--failed "$name=$OUT/$slug.log")
            fi
            echo "::endgroup::"
          }

          plan_module "devops" "devops" "remitmortgage/staging/terraform.tfstate" -var="environment=staging"
          plan_module "devops/terraform" "devops/terraform" "remitmortgage/multi-region/terraform.tfstate"

          node scripts/terraform-plan-summary.mjs --out "$OUT/summary.md" "${ARGS[@]}"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Create or update the PR comment
        run: |
          set -euo pipefail
          MARKER='<!-- terraform-plan-summary-bot -->'
          BODY_FILE="$RUNNER_TEMP/tfplan/summary.md"
          COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\"))) | .id" | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -F body=@"$BODY_FILE" > /dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -F body=@"$BODY_FILE" > /dev/null
          fi

      - name: Upload plan logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-logs
          path: |
            ${{ runner.temp }}/tfplan/*.log
            ${{ runner.temp }}/tfplan/summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if any plan failed
        if: steps.plan.outputs.failed == '1'
        run: |
          echo "::error::terraform plan failed for at least one module. See the PR comment and the uploaded plan logs."
          exit 1

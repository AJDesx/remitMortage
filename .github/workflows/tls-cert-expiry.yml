name: TLS Certificate Expiry Monitoring

# An expired TLS certificate on a public endpoint is a scheduled outage. This
# job checks every production domain's certificate once a day and alerts ops by
# email while a certificate is still inside its renewal window, distinguishing
# auto-renewing certificates (Let's Encrypt / AWS ACM) from ones that need a
# human to reissue them.
#
# Renewal procedure: devops/TLS_CERTIFICATE_RENEWAL.md
on:
  schedule:
    # 06:00 UTC daily — a day's resolution is plenty against a 14-day window.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Override the renewal warning window (days)'
        required: false
        default: ''
  # Guard the check against regressions when its own inputs change.
  pull_request:
    paths:
      - '.github/workflows/tls-cert-expiry.yml'
      - 'scripts/check-tls-cert-expiry.sh'
      - 'devops/tls-monitor-domains.txt'

permissions:
  contents: read

concurrency:
  group: tls-cert-expiry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-cert-expiry:
    name: Check Production Certificate Expiry
    runs-on: ubuntu-latest

    env:
      # Effective domain list: the repo variable when set, otherwise the
      # checked-in fallback file (devops/tls-monitor-domains.txt).
      TLS_MONITOR_DOMAINS: ${{ vars.TLS_MONITOR_DOMAINS }}
      # 14-day renewal window by default; a manual run can override it.
      TLS_WARN_DAYS: ${{ github.event.inputs.warn_days || vars.TLS_WARN_DAYS || '14' }}
      TLS_CERT_REPORT_PATH: tls-cert-expiry-report.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 On a PR that only touches the monitor's own inputs, just prove the
      # domain list still parses — PRs cannot reach production endpoints and
      # the placeholder list is intentionally unresolvable.
      - name: Validate Domain List (pull request)
        if: github.event_name == 'pull_request'
        run: ./scripts/check-tls-cert-expiry.sh --check-config

      - name: Run TLS Certificate Expiry Check
        id: check
        if: github.event_name != 'pull_request'
        run: ./scripts/check-tls-cert-expiry.sh

      - name: Upload Expiry Report
        # Keep the report either way — a passing run is the audit record that
        # certificates were verified today.
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tls-cert-expiry-report
          path: ${{ env.TLS_CERT_REPORT_PATH }}
          retention-days: 90

      # Alerts are scoped to scheduled/manual runs; a failing PR run already
      # surfaces on the PR itself and needs no page.
      - name: Email Alert on Certificate Approaching Expiry
        if: failure() && steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.ALERT_SMTP_SERVER }}
          server_port: ${{ secrets.ALERT_SMTP_PORT }}
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          from: RemitMortgage TLS Monitor
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: "[ACTION] TLS certificate approaching expiry — ${{ github.repository }}"
          body: |
            One or more production TLS certificates are inside the
            ${{ env.TLS_WARN_DAYS }}-day renewal warning window, are already
            expired, or could not be reached.

            Repository:   ${{ github.repository }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.event_name }}

            The attached "tls-cert-expiry-report" artifact lists each endpoint
            with its days-remaining, state (OK / EXPIRING / EXPIRED /
            UNREACHABLE) and whether renewal is automated:

              - renewal=auto   the certbot / ACM pipeline should have renewed
                               this already. Treat as a broken automation
                               incident.
              - renewal=manual a human must reissue and redeploy the
                               certificate.

            Runbook: devops/TLS_CERTIFICATE_RENEWAL.md

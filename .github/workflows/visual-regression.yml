name: Visual Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

jobs:
  visual-regression:
    name: Visual Regression (Percy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js Application
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAWXDSZM52E5BW7G6TFX7DTXSHF7F75TUSSWW7B442NBEU3CADXNVTXH
          NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          NEXT_PUBLIC_USDC_TOKEN_ID: CCERWUE35WN7M4PN6XYK7CDCJZX35TC53TFATJNBRA6I3FDS3RVS65YF
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"

      - name: Start Next.js App in Background
        run: npm run start &
        working-directory: frontend
        env:
          PORT: 3000

      - name: Wait for Next.js Server to be Ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Percy Visual Snapshots
        run: npx percy snapshot --baseUrl http://localhost:3000 --config percy.config.js --fail-on-changed snapshots.txt
        working-directory: frontend
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

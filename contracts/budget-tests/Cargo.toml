[package]
name = "budget-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "CPU / memory budget regression tests for the Soroban contract entry points"

[lib]
doctest = false

[features]
# `escrow`, `lending-pool` and `bridge-adapter` do not currently compile in the
# workspace (the lending-pool `DataKey` enum exceeds the SDK variant limit and
# bridge-adapter references missing `BridgeError` variants), so their budget
# scenarios are opt-in. Add them to `default` once those crates build again.
default = []
escrow = ["dep:escrow"]
lending-pool = ["dep:lending-pool"]
bridge-adapter = ["dep:bridge-adapter"]

[dependencies]
serde_json = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }
milestone = { path = "../milestone" }
governance = { path = "../governance" }
insurance-pool = { path = "../insurance-pool" }
multisig-validator = { path = "../multisig-validator" }
oracle-price = { path = "../oracle-price" }
staking-pool = { path = "../staking-pool" }
verification-registry = { path = "../verification-registry" }
yield-vault = { path = "../yield-vault" }
escrow = { path = "../escrow", optional = true }
lending-pool = { path = "../lending-pool", optional = true }
bridge-adapter = { path = "../bridge-adapter", optional = true }

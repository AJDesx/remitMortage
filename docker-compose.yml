version: '3.8'

services:
  clamav:
    image: clamav/clamav:1.4.3
    container_name: remitmortgage-clamav
    expose:
      - "3310"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: remitmortgage-postgres
    environment:
      POSTGRES_USER: remituser
      POSTGRES_PASSWORD: remitpass
      POSTGRES_DB: remitmortgage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remituser -d remitmortgage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-cluster-node-1:
    image: redis:7-alpine
    container_name: remitmortgage-redis-1
    ports:
      - "6379:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes-1.conf --appendonly yes --port 6379
    volumes:
      - redis-node-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cluster-node-2:
    image: redis:7-alpine
    container_name: remitmortgage-redis-2
    ports:
      - "6380:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes-2.conf --appendonly yes --port 6379
    volumes:
      - redis-node-2-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cluster-node-3:
    image: redis:7-alpine
    container_name: remitmortgage-redis-3
    ports:
      - "6381:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes-3.conf --appendonly yes --port 6379
    volumes:
      - redis-node-3-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7-alpine
    container_name: remitmortgage-redis-init
    depends_on:
      redis-cluster-node-1:
        condition: service_healthy
      redis-cluster-node-2:
        condition: service_healthy
      redis-cluster-node-3:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Creating Redis cluster...' &&
        redis-cli --cluster create
          redis-cluster-node-1:6379
          redis-cluster-node-2:6379
          redis-cluster-node-3:6379
          --cluster-replicas 0
          --cluster-yes
      "

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remitmortgage-migration
    environment:
      DATABASE_URL: postgresql://remituser:remitpass@postgres:5432/remitmortgage
    command: sh scripts/run-migrations.sh
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remitmortgage-backend
    environment:
      DATABASE_URL: postgresql://remituser:remitpass@postgres:5432/remitmortgage
      PORT: 4000
      STELLAR_NETWORK: testnet
      HORIZON_URL: http://stellar-quickstart:8000
      REDIS_CLUSTER_ENABLED: "true"
      REDIS_CLUSTER_NODES: redis-cluster-node-1:6379,redis-cluster-node-2:6379,redis-cluster-node-3:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    ports:
      - "4000:4000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    restart: unless-stopped

  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: stellar-quickstart
    ports:
      - "8000:8000"
    command: >
      /start --local --enable-soroban-rpc
    environment:
      - NETWORK=local
    volumes:
      - stellar-data:/opt/stellar
    restart: unless-stopped

volumes:
  postgres-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  stellar-data:
